<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hill Climb Racing</title>

  <!-- Keep this script above <base>, so its path points at this site. -->
  <script src="../../shared/ytgame-stub.js"></script>

  <!-- The game's files are loaded from this folder. -->
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@ed57fd6dbc91143221b05fdf61be73bacc375843/hill-climb-racing-lite/">

  <style type="text/css">
    html, body {
      height: 100%;
      background: #000;
    }

    body {
      position: fixed; /* Prevent overscroll */
      margin: 0;
      padding: 0;
      touch-action: none;
      overscroll-behavior: none;
    }

    .canvas-app-container {
      width: 100%;
      height: 100%;
      position: absolute;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .canvas-app-container:-webkit-full-screen {
      /* Auto width and height in Safari/Chrome fullscreen. */
      width: auto;
      height: auto;
    }

    #canvas {
      outline: none;
      border: 0;
      width: 100%;
      vertical-align: bottom;
    }

    #canvas-container {
      position: relative;
    }

    canvas:focus, canvas:active {
      outline: none;
      border: 0;
      -moz-outline-style: none;
    }

    div {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="engine-config"
       data-engine-arguments="--verify-graphics-calls=false,"
       data-custom-heap-size="33554432"
       data-exe-name="HCRLite"
       data-display-width="470"
       data-display-height="836"></div>

  <script src="loader.js"></script>
  <script src="yt-functions.js"></script>

  <div id="app-container" class="canvas-app-container">
    <div id="canvas-container" class="canvas-app-canvas-container">
      <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="470" height="836"></canvas>
    </div>
  </div>
</body>
</html>
