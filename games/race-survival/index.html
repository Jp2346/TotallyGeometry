<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Race Survival</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/google-com-classroom/424@main/TemplateData/style.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
    #unity-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
    }
    #unity-canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
  <script src="../../shared/yandex-compat.js"></script>
</head>
<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/google-com-classroom/424@main/logo.png" alt=""></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const hideFullScreenButton = "";
    const buildUrl = "https://cdn.jsdelivr.net/gh/google-com-classroom/424@main/Build";
    const loaderUrl = buildUrl + "/YandexILoveU.loader.js";
    const config = {
      dataUrl: buildUrl + "/YandexILoveU.data.unityweb",
      frameworkUrl: buildUrl + "/YandexILoveU.framework.js.unityweb",
      codeUrl: buildUrl + "/YandexILoveU.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Pixup",
      productName: "Racer Kings: Cars Arena",
      productVersion: "0.0.0.1"
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector(".spinner");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    canvas.style.background = "url('https://cdn.jsdelivr.net/gh/google-com-classroom/424@main/background.png') center / cover";
    loadingCover.style.display = "";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        window.myGameInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
