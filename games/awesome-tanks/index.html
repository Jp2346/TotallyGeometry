<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome Tanks</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0d1020; }
    #game { width: 100%; height: 100%; }
    #fallback {
      margin: 0;
      padding: 2rem;
      color: #9aa3c4;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <p id="fallback" hidden>The Flash player couldn't load. Check your connection and reload the page.</p>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      scale: "showAll",
      forceScale: true,
      salign: "",
      forceAlign: true,
      letterbox: "on"
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    (function () {
      if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
        document.getElementById('fallback').hidden = false;
        return;
      }
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';
      document.getElementById('game').appendChild(player);
      player.load('awesomeTanks.swf');
    })();
  </script>
</body>
</html>
